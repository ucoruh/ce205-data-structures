# CEN207 course site: on every push to main, build the MkDocs site and publish it to GitHub Pages (gh-pages).
# Course outputs (PDF, PPTX, DOCX, slide HTML) are committed ready-made; only the MkDocs site is built here.
name: ci
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git-revision-date and git-authors plugins need the full history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - run: pip install "mkdocs<2"
      - run: pip install pymdown-extensions
      - run: pip install mkdocs-material
      - run: pip install mkdocs-material-extensions
      - run: pip install mkdocs-simple-hooks
      - run: pip install mkdocs-video
      - run: pip install mkdocs-minify-plugin
      - run: pip install mkdocs-git-revision-date-localized-plugin
      - run: pip install mkdocs-static-i18n
      - run: pip install mkdocs-with-pdf
      - run: pip install qrcode
      - run: pip install mkdocs-awesome-pages-plugin
      - run: pip install mkdocs-include-markdown-plugin
      - run: pip install mkdocs-ezlinks-plugin
      - run: pip install mkdocs-git-authors-plugin
      - run: pip install mkdocs-git-committers-plugin
      - run: pip install mkdocs-exclude
      - run: pip install pptx2md
      - run: pip install mkdocs-macros-plugin
      - name: gh-pages commits in the instructor's name
        run: |
          git config user.name "Ugur Coruh"
          git config user.email "ugur.coruh.tr@gmail.com"
      - run: mkdocs gh-deploy --force
