<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double-ended queue (deque): push/pop at both ends</title>
<style>/* dsanim oynatıcı biçemi — açık/koyu tema; SVG renkleri Python'daki RENK tablosuyla aynı anlamda */
:root {
  --dsa-zemin: #ffffff; --dsa-yuzey: #f8f9fa; --dsa-cizgi: #dee2e6; --dsa-yazi: #1f2933; --dsa-soluk: #6c757d;
  --dsa-vurgu: #fff3bf; --dsa-vurgu-c: #f08c00; --dsa-ana: #1971c2; --dsa-kod: #f8f9fa; --dsa-kod-yazi: #24292f;
}
@media (prefers-color-scheme: dark) {
  :root:not(.dsa-acik) {
    --dsa-zemin: #1e2129; --dsa-yuzey: #262a33; --dsa-cizgi: #3a3f4b; --dsa-yazi: #e9ecef; --dsa-soluk: #adb5bd;
    --dsa-vurgu: #5c4813; --dsa-vurgu-c: #fcc419; --dsa-ana: #4dabf7; --dsa-kod: #161b22; --dsa-kod-yazi: #e6edf3;
  }
}
:root.dsa-koyu {
  --dsa-zemin: #1e2129; --dsa-yuzey: #262a33; --dsa-cizgi: #3a3f4b; --dsa-yazi: #e9ecef; --dsa-soluk: #adb5bd;
  --dsa-vurgu: #5c4813; --dsa-vurgu-c: #fcc419; --dsa-ana: #4dabf7; --dsa-kod: #161b22; --dsa-kod-yazi: #e6edf3;
}
html, body { margin: 0; background: var(--dsa-zemin); color: var(--dsa-yazi);
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
.dsa { box-sizing: border-box; padding: 10px 12px 12px; outline: none; max-width: 1200px; margin: 0 auto; }
.dsa *, .dsa *::before, .dsa *::after { box-sizing: border-box; }
.dsa-ust { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.dsa-baslik { font-weight: 700; font-size: 1.05rem; }

@media (max-width: 760px) { .dsa-govde { grid-template-columns: 1fr; } }
.dsa-sahne { background: var(--dsa-yuzey); border: 1px solid var(--dsa-cizgi); border-radius: 10px; overflow: hidden;
  display: flex; align-items: center; }
.dsa-sahne { justify-content: center; }
.dsa-sahne svg { width: 100%; height: auto; max-height: 440px; display: block; }
.dsa-kod { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--dsa-cizgi); border-radius: 10px;

  font: 13px/1.5 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace;
  font-variant-ligatures: none; font-feature-settings: 'calt' 0, 'liga' 0; }
.dsa-sat { display: block; padding: 0 10px 0 0; white-space: pre; transition: background .3s; border-left: 3px solid transparent; }
.dsa-sat.vurgu { background: var(--dsa-vurgu); border-left-color: var(--dsa-vurgu-c); }
.dsa-no { display: inline-block; width: 2.6em; padding-right: .8em; text-align: right; color: var(--dsa-soluk); user-select: none; }
.dsa-cap { margin-top: 10px; min-height: 3.2em; padding: 10px 14px; border-radius: 10px; background: var(--dsa-yuzey);
  border: 1px solid var(--dsa-cizgi); font-size: 1.02rem; line-height: 1.5; }

  color: var(--dsa-yazi); cursor: pointer; font-size: 15px; }
.dsa-d:hover { border-color: var(--dsa-ana); }
.dsa-d.dsa-ana { background: var(--dsa-ana); color: #fff; border-color: var(--dsa-ana); min-width: 50px; }
.dsa-d.etkin { border-color: var(--dsa-ana); color: var(--dsa-ana); }
.dsa-cubuk { flex: 1; min-width: 120px; accent-color: var(--dsa-ana); }
.dsa-hiz { height: 34px; border-radius: 8px; border: 1px solid var(--dsa-cizgi); background: var(--dsa-yuzey); color: var(--dsa-yazi); }
.dsa-statik .dsa-denetim { display: none; }
/* iki dilli sahne yazıları: yalnız sayfa dilindeki görünür */
.dsa-dil-tr .l-en, .dsa-dil-en .l-tr { display: none; }
/* sahne öğeleri: renk geçişleri ve belirme/solma */

.dsa svg .dsa-giris { opacity: 0; }

/* koyu tema: SVG'deki açık renkleri sınıflarla geçersiz kıl */

:root.dsa-koyu .dsa svg .shp.st-bos rect { fill: #23272f; }
:root.dsa-koyu .dsa svg .ok.st-normal { stroke: #adb5bd; }
:root.dsa-koyu .dsa svg .frm rect { fill: #262a33; }
:root.dsa-koyu .dsa svg .frm text { fill: #ced4da; }
@media (prefers-color-scheme: dark) {
  :root:not(.dsa-acik) .dsa svg .shp.st-normal rect, :root:not(.dsa-acik) .dsa svg .shp.st-normal circle { fill: #2b303b; stroke: #ced4da; }

  :root:not(.dsa-acik) .dsa svg .shp.st-normal line { stroke: #ced4da; }
  :root:not(.dsa-acik) .dsa svg .shp.st-normal circle[r="3.5"] { fill: #ced4da; }
  :root:not(.dsa-acik) .dsa svg .shp.st-bos rect { fill: #23272f; }
  :root:not(.dsa-acik) .dsa svg .ok.st-normal { stroke: #adb5bd; }
  :root:not(.dsa-acik) .dsa svg .frm rect { fill: #262a33; }
  :root:not(.dsa-acik) .dsa svg .frm text { fill: #ced4da; }
}
/* slayt kipi (?yer=slayt): 16:9 slayttaki iframe'e sığan sıkı yerleşim */
.dsa-slayt body { overflow: hidden; }
.dsa-slayt .dsa { padding: 4px 6px 6px; max-width: none; }
.dsa-slayt .dsa-ust { margin-bottom: 2px; }
.dsa-slayt .dsa-baslik { visibility: hidden; }
.dsa-slayt .dsa-govde { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px; }

.dsa-slayt .dsa-denetim { margin-top: 6px; gap: 4px; }
.dsa-slayt .dsa-d { height: 28px; min-width: 32px; font-size: 13px; }
.dsa-slayt .dsa-hiz { height: 28px; }
@media print { .dsa-denetim { display: none; } .dsa-pre { max-height: none; } }
/* v2: example bar (preset, difficulty, random) and own values */
.dsa-ornek, .dsa-kendi { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; font-size: .85rem; }
.dsa-etk { color: var(--dsa-soluk); }
.dsa-sec { height: 30px; border-radius: 8px; border: 1px solid var(--dsa-cizgi); background: var(--dsa-yuzey); color: var(--dsa-yazi);
  max-width: 100%; }
.dsa-ornek .dsa-sec:first-of-type { flex: 1 1 220px; }
.dsa-zar { min-width: 34px; height: 30px; font-size: 16px; }
.dsa-girdi { flex: 1 1 260px; height: 30px; border-radius: 8px; border: 1px solid var(--dsa-cizgi); padding: 0 10px;
  background: var(--dsa-yuzey); color: var(--dsa-yazi); font: 13px 'Cascadia Mono', Consolas, monospace; }
.dsa-uygula { height: 30px; min-width: 64px; }
.dsa-hata { flex-basis: 100%; color: #e03131; font-size: .82rem; min-height: 1em; }
.dsa-kendi[hidden] { display: none; }
.dsa-slayt .dsa-ornek { margin-bottom: 4px; font-size: .78rem; }
.dsa-slayt .dsa-sec, .dsa-slayt .dsa-zar { height: 26px; }
.dsa-slayt .dsa-kendi, .dsa-slayt .dsa-ornek .dsa-etk { display: none; }
.dsa-statik .dsa-ornek, .dsa-statik .dsa-kendi { display: none; }
/* v2.1: input strip (every input value from the start; current = highlighted, done = faded, next = dashed),
   up-next line, speed − / + ; the controls sit ABOVE the scene so a long caption never pushes them away */
.dsa-serit { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 0 8px; font-size: .85rem; }
.dsa-serit[hidden] { display: none; }
.dsa-serit .dsa-etk { margin-right: 4px; }
.dsa-jeton { font: 13px/1.2 'Cascadia Mono', Consolas, monospace; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--dsa-cizgi);
  background: var(--dsa-yuzey); color: var(--dsa-yazi); transition: background .3s, border-color .3s, opacity .3s; white-space: nowrap; }
.dsa-jeton.bitti { opacity: .4; }
.dsa-jeton.simdi { background: var(--dsa-vurgu); border-color: var(--dsa-vurgu-c); font-weight: 700; box-shadow: inset 0 0 0 1px var(--dsa-vurgu-c); }
.dsa-jeton.sonra { border-color: var(--dsa-ana); border-style: dashed; }
.dsa-denetim { margin: 0 0 8px; }
.dsa-sonraki { margin-top: 6px; color: var(--dsa-soluk); font-size: .88rem; line-height: 1.35; }
.dsa-sonraki-etk { font-weight: 700; color: var(--dsa-ana); }
.dsa-statik .dsa-serit, .dsa-statik .dsa-sonraki { display: none; }
@media print { .dsa-serit, .dsa-sonraki { display: none; } }
/* slide mode: fill the iframe; scene and code take the free height, caption scrolls inside its own box */
html.dsa-slayt, html.dsa-slayt body { height: 100%; }
.dsa-slayt .dsa { display: flex; flex-direction: column; height: 100vh; }
.dsa-slayt .dsa-ust, .dsa-slayt .dsa-ornek, .dsa-slayt .dsa-serit, .dsa-slayt .dsa-denetim { flex: 0 0 auto; }
.dsa-slayt .dsa-govde { flex: 1 1 auto; min-height: 0; }
.dsa-slayt .dsa-sahne { min-height: 0; height: 100%; }
.dsa-slayt .dsa-sahne svg { height: 100%; max-height: 100%; }

.dsa-slayt .dsa-denetim { margin: 0 0 4px; }
.dsa-slayt .dsa-serit { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; margin-bottom: 4px; scrollbar-width: none; }
.dsa-slayt .dsa-serit::-webkit-scrollbar { display: none; }
.dsa-slayt .dsa-jeton { font-size: 11.5px; padding: 2px 5px; flex: 0 0 auto; }
.dsa-slayt .dsa-cap { flex: 0 0 auto; max-height: 4.4em; overflow-y: auto; }
.dsa-slayt .dsa-sonraki { flex: 0 0 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .8rem; margin-top: 3px; }
</style>

<body>
<div data-dsanim="deque"></div>
<script>/* dsanim v2 — scene model, SVG renderer and frame recorder.
 *
 * An animation is a function build(S, data) that adds elements to a Scene S, changes them and calls S.step(...)
 * after every visible change. The same code runs in the browser (player: frames are built from the dataset the
 * user picks, types or randomises) and in Node (export.js: GIF/PNG for slides and printed notes).
 *
 * Elements (all positions in scene units; the view box is cropped to the content automatically):
 *   box(id, {x, y, w, h, text, style, below, above, size, mono})      array cell, stack slot, generic rectangle
 *   node(id, {x, y, w, h, value, style, isNull, below})               linked-list node: [ value | • ]
 *   circle(id, {x, y, r, text, style, below})                          tree / graph vertex (x, y = centre)
 *   label(id, {x, y, text, style, size, anchor, bold, mono})           free text
 *   pointer(id, {target, text, side, style, dist})                     named pointer (top, head, front…) that follows its target
 *   arrow(id, {from, to, kind, style, text, bend, head})               kind 'next' (from a node's pointer cell) or 'center'
 *   region(id, {x, y, w, h, title, style})                             dashed background frame
 *   brace(id, {from, to, text, side, style, dist})                     curly brace over the elements from … to (their
 *                                                                      union), with a label: "already sorted", "< key"
 * Styles: normal, hl (highlight), new, del (removed), dim, active, empty.
 * Any text may be a plain string or {tr: '…', en: '…'}.
 *
 * Following the instructor's static drawings: name every array row on its left (label "A ="), put index numbers
 * above the cells (box `above`), mark regions with braces, write the comparison on the right ("< 9"), and when the
 * path matters (binary search, partition…) keep earlier states visible as rows with S.snapshot().
 *   S.at(k)                          the input value with index k (in input.tokens / input.format order) is being
 *                                    processed from the next step on; the player highlights it in the input strip
 *   S.snapshot(prefix, ids, dx, dy, style)   copy elements (pointers/arrows/braces between them follow) to new ids
 *                                    prefix+id, shifted by (dx, dy) — a "trace row" that stays on screen
 */
(function (root) {
  'use strict';

  var COLORS = {
    normal: ['#ffffff', '#37474f', '#1f2933'],
    hl: ['#fff3bf', '#f08c00', '#1f2933'],
    new: ['#d3f9d8', '#2f9e44', '#1f2933'],
    del: ['#ffe3e3', '#e03131', '#1f2933'],
    dim: ['#f1f3f5', '#adb5bd', '#868e96'],
    active: ['#d0ebff', '#1971c2', '#1f2933'],
    empty: ['#f8f9fa', '#ced4da', '#adb5bd']
  };
  var ARROW = { normal: '#495057', hl: '#f08c00', new: '#2f9e44', del: '#e03131', dim: '#adb5bd', active: '#1971c2', empty: '#ced4da' };
  var FONT = "'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
  var MONO = "Consolas, 'DejaVu Sans Mono', 'Cascadia Mono', monospace";
  var PW = 26; // width of the pointer cell of a list node

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function num(v) { return (Math.round(v * 10) / 10).toString(); }
  function txt(v, lang) {
    if (v === null || v === undefined) return '';
    if (typeof v !== 'object') return esc(v);
    if (lang) return esc(v[lang] !== undefined ? v[lang] : (v.en || ''));
    return '<tspan class="l-tr">' + esc(v.tr || '') + '</tspan><tspan class="l-en">' + esc(v.en || '') + '</tspan>';
  }
  function longest(v) {
    if (v && typeof v === 'object') return (v.tr || '').length > (v.en || '').length ? (v.tr || '') : (v.en || '');
    return String(v === undefined || v === null ? '' : v);
  }
  function copy(o) { return JSON.parse(JSON.stringify(o)); }

  // ------------------------------------------------------------------ scene
  function Scene() { this.el = {}; this.order = []; this.frames = []; this.cursor = undefined; }

  Scene.prototype._add = function (id, kind, p) {
    p = p || {};
    p.kind = kind;
    if (!p.style) p.style = kind === 'pointer' ? 'active' : (kind === 'region' ? 'dim' : 'normal');
    if (!(id in this.el)) this.order.push(id);
    this.el[id] = p;
    return id;
  };
  Scene.prototype.box = function (id, p) { p = p || {}; p.w = p.w || 58; p.h = p.h || 44; p.size = p.size || 18; if (p.mono === undefined) p.mono = true; return this._add(id, 'box', p); };
  Scene.prototype.node = function (id, p) { p = p || {}; p.w = p.w || 46; p.h = p.h || 40; return this._add(id, 'node', p); };
  Scene.prototype.circle = function (id, p) { p = p || {}; p.r = p.r || 22; return this._add(id, 'circle', p); };
  Scene.prototype.label = function (id, p) { p = p || {}; p.size = p.size || 15; p.anchor = p.anchor || 'middle'; return this._add(id, 'label', p); };
  Scene.prototype.pointer = function (id, p) { p = p || {}; p.side = p.side || 'top'; p.dist = p.dist === undefined ? 34 : p.dist; p.x = 0; p.y = 0; return this._add(id, 'pointer', p); };
  Scene.prototype.arrow = function (id, p) { p = p || {}; p.type = p.kind || 'next'; delete p.kind; p.bend = p.bend || 0; p.x = 0; p.y = 0; if (p.head === undefined) p.head = true; return this._add(id, 'arrow', p); };
  Scene.prototype.region = function (id, p) { return this._add(id, 'region', p || {}); };
  Scene.prototype.brace = function (id, p) { p = p || {}; p.side = p.side || 'top'; p.dist = p.dist === undefined ? 8 : p.dist; p.x = 0; p.y = 0; if (!p.style) p.style = 'active'; return this._add(id, 'brace', p); };
  /** From the next recorded step on, input value k is the one being processed (player: input strip). null = none. */
  Scene.prototype.at = function (k) { this.cursor = k === null ? undefined : k; };
  /** Copy elements to prefix+id, shifted by (dx, dy); links among the copied ids are re-pointed to the copies. */
  Scene.prototype.snapshot = function (prefix, ids, dx, dy, style) {
    var out = [], self = this;
    ids.forEach(function (id) {
      var o = self.el[id];
      if (!o) return;
      var c = copy(o), linked = ['target', 'from', 'to'].filter(function (k) { return c[k] !== undefined; });
      if (linked.some(function (k) { return ids.indexOf(c[k]) < 0; })) return;   // would point outside the copy
      linked.forEach(function (k) { c[k] = prefix + c[k]; });
      if (c.kind !== 'pointer' && c.kind !== 'arrow' && c.kind !== 'brace') { c.x += dx || 0; c.y += dy || 0; }
      if (style) c.style = style;
      self._add(prefix + id, c.kind, c);
      out.push(prefix + id);
    });
    return out;
  };

  Scene.prototype.has = function (id) { return id in this.el; };
  Scene.prototype.get = function (id) { return this.el[id]; };
  Scene.prototype.set = function (id, p) { var o = this.el[id]; if (!o) return; for (var k in p) o[k] = p[k]; };
  Scene.prototype.move = function (id, x, y) { var o = this.el[id]; if (!o) return; if (x !== null && x !== undefined) o.x = x; if (y !== null && y !== undefined) o.y = y; };
  Scene.prototype.remove = function () {
    for (var i = 0; i < arguments.length; i++) {
      var id = arguments[i];
      if (id in this.el) { delete this.el[id]; this.order.splice(this.order.indexOf(id), 1); }
    }
  };
  Scene.prototype.styleAll = function (style, kind) {
    for (var id in this.el) {
      var o = this.el[id];
      if ((!kind || o.kind === kind) && o.kind !== 'pointer' && o.kind !== 'region') o.style = style;
    }
  };
  /** Record the current state. caption: {tr, en}; lines: {c: n | [n…], java: …} (1-based code lines). */
  Scene.prototype.step = function (caption, lines) {
    var l = {};
    for (var k in (lines || {})) l[k] = Array.isArray(lines[k]) ? lines[k] : [lines[k]];
    var state = {};
    for (var i = 0; i < this.order.length; i++) state[this.order[i]] = copy(this.el[this.order[i]]);
    this.frames.push({ state: state, order: this.order.slice(), cap: caption, lines: l, at: this.cursor });
  };

  // ------------------------------------------------------------------ geometry
  function bbox(d, id) {
    var o = d[id];
    switch (o.kind) {
      case 'box': case 'region': return [o.x, o.y, o.w, o.h];
      case 'node': return [o.x, o.y, o.w + PW, o.h];
      case 'circle': return [o.x - o.r, o.y - o.r, 2 * o.r, 2 * o.r];
      case 'label':
        var w = Math.max(20, longest(o.text).length * o.size * 0.58);

        data: { ops: ['5', '-8', 'f12', 'pb', 'f-20', 'pf', '15', '-3', 'f7', 'pb', 'pf', 'f-9', '22', 'pb'] } },
      { id: 'pop-empty-both-ends', level: 'edge', name: T('Her iki uçtan da boşken pop, sonra doldur ve yine boşalt', 'Pop at both ends while empty, then fill and drain again'),
        data: { ops: ['pf', 'pb', '10', '20', '30', 'pf', 'pb', 'f5', 'pb', 'pf', 'pb', 'pf'] } },
      { id: 'stack-only', level: 'edge', name: T('Yalnız arka uç: deque bir yığın gibi davranır', 'Only the back end: the deque behaves like a stack'),
        data: { ops: ['10', '20', 'pb', '30', '40', 'pb', '50', '60', 'pb', '70'] } },
      { id: 'queue-only', level: 'edge', name: T('Arkaya ekle, önden çıkar: deque bir kuyruk gibi davranır', 'Add at the back, remove at the front: the deque behaves like a queue'),
        data: { ops: ['10', '20', '30', 'pf', '40', 'pf', '50', '60', 'pf', '70'] } }
    ],
    levels: ['easy', 'normal', 'hard', 'extreme'],
    /** Total number of operations (all four kinds counted) — every example must have at least 10. */
    size: function (d) { return d.ops.length; },
    /** Independent computation of the expected outcome (checked against S.result by test.js). */
    reference: function (d) {
      var el = [], poppedFront = [], poppedBack = [], underFront = 0, underBack = 0;
      // independent of parseTok(): read each token by its first character
      d.ops.forEach(function (tok) {
        if (tok === 'pb') { if (el.length) poppedBack.push(el.pop()); else underBack++; }
        else if (tok === 'pf') { if (el.length) poppedFront.push(el.shift()); else underFront++; }
        else if (tok.charAt(0) === 'f') el.unshift(Number(tok.slice(1)));
        else el.push(Number(tok));
      });
      return { deque: el, poppedFront: poppedFront, poppedBack: poppedBack, underflowFront: underFront, underflowBack: underBack };
    },
    random: function (level, r) {
      var n = { easy: 10, normal: 12, hard: 16, extreme: 20 }[level];
      var lo = level === 'extreme' ? -500 : -50, hi = level === 'extreme' ? 500 : 50;
      var ops = [];
      for (var i = 0; i < n; i++) {
        var x = r();
        if (x < 0.38) ops.push(String(D.randInt(r, lo, hi)));
        else if (x < 0.76) ops.push('f' + D.randInt(r, lo, hi));

        else ops.push('pf');

    },
    input: {
      hint: T('Örnek: 10 20 f5 pb f-3 pf 30   (sayı = arkaya ekle, fN = öne ekle, pb = arkadan çıkar, pf = önden çıkar)',
              'Example: 10 20 f5 pb f-3 pf 30   (number = push at back, fN = push at front, pb = pop back, pf = pop front)'),
      parse: function (text) {

                                       '"' + tok + '" is not understood: write a number (back), fN (front), pb (pop back) or pf (pop front).');
        });

      format: function (d) { return d.ops.join(' '); },

    build: function (S, d) {

      S.label('frontLbl', { x: MID - 5 * DX - 40, y: Y - 56, text: T('ön (front)', 'front'), style: 'dim', size: 15 });
      S.label('backLbl', { x: MID + 5 * DX + 40, y: Y - 56, text: T('arka (back)', 'back'), style: 'dim', size: 15 });
      S.label('info', { x: MID, y: Y - 92, text: T('boş deque', 'empty deque'), style: 'dim', size: 16 });
      S.label('ops', { x: MID, y: Y - 68, text: T(d.ops.length + ' işlem', d.ops.length + ' operations'), style: 'dim', size: 14 });
      S.label('decision', { x: MID, y: Y - 44, text: '', bold: true, size: 16, mono: true });
      function decide(text, style) { S.set('decision', { text: text || '', style: style || 'normal' }); }
      var FX0 = 140, PY_F = Y + 100, PY_B = Y + 150, PW = 42;
      S.label('fplbl', { x: FX0 - 16, y: PY_F + 5, text: T('ön çıkanlar =', 'front popped ='), anchor: 'end', style: 'dim', size: 13 });
      S.label('bplbl', { x: FX0 - 16, y: PY_B + 5, text: T('arka çıkanlar =', 'back popped ='), anchor: 'end', style: 'dim', size: 13 });
      function addPopped(which, v) {
        var arr = which === 'front' ? poppedFront : poppedBack, idx = arr.length - 1;
        var prefix = which === 'front' ? 'pf' : 'pb', y = which === 'front' ? PY_F : PY_B;
        if (idx > 0) S.set(prefix + (idx - 1), { style: 'dim' });
        S.box(prefix + idx, { x: FX0 + idx * PW, y: y, w: 36, h: 30, text: String(v), style: 'new', size: 13 });
      }
      S.step(T('Deque (çift uçlu kuyruk) her iki uçtan da ekleme ve çıkarma yapılmasına izin verir: yığın ile kuyruğun birleşimi gibi. Sırada ' + d.ops.length + ' işlem var.',
               'A deque (double-ended queue) allows adding and removing at both ends: it is like a stack and a queue combined. ' + d.ops.length + ' operations follow.'),
             { c: 1, java: 1 });

      function clean() { ids.forEach(function (id) { S.set(id, { style: 'normal' }); }); }
      function reflow() {
        var start = MID - ids.length * DX / 2 + DX / 2;
        for (var i = 0; i < ids.length; i++) S.move(ids[i], start + i * DX, Y);
      }
      function count() {
        S.set('info', { text: ids.length ? T(ids.length + ' eleman', ids.length + ' element' + (ids.length > 1 ? 's' : '')) : T('boş deque', 'empty deque') });
      }

      d.ops.forEach(function (tok, k) {
        clean(); decide('', 'normal'); S.at(k);
        var t = parseTok(tok);

        if (t.op === 'push_back') {
          pushBackN++;
          var idb = 'e' + (seq++);
          S.box(idb, { x: MID, y: Y, w: BW, h: BH, text: String(t.v), style: 'new', size: 20 });
          ids.push(idb); vals.push(t.v);
          reflow(); count();
          if (pushBackN === 1) {
            S.step(T('`push_back(' + t.v + ')` — yeni eleman arkaya eklenir.', '`push_back(' + t.v + ')` — the new element is added at the back.'), { c: [4, 5, 6, 7, 8], java: [3, 4] });
            S.set(idb, { style: 'normal' });
            S.step(T('Arkaya ekleme her zaman O(1): dizinin başka hiçbir hücresi kaymaz, sadece `rear` güncellenir.',

          } else {
            S.set(idb, { style: 'normal' });
            S.step(T('`push_back(' + t.v + ')` — arkaya eklendi.', '`push_back(' + t.v + ')` — added at the back.'), { c: [4, 5, 6, 7, 8], java: [3, 4] });
          }

        }

        if (t.op === 'push_front') {
          pushFrontN++;
          var idf = 'e' + (seq++);
          S.box(idf, { x: MID, y: Y, w: BW, h: BH, text: String(t.v), style: 'new', size: 20 });
          ids.unshift(idf); vals.unshift(t.v);
          reflow(); count();
          if (pushFrontN === 1) {
            S.step(T('`push_front(' + t.v + ')` — yeni eleman **öne** eklenir; sıradan bir kuyruk bunu yapamazdı.',
                     '`push_front(' + t.v + ')` — the new element is added at the **front**; a plain queue could not do this.'), { c: [10, 11, 12, 13, 14], java: [6, 7] });
            S.set(idf, { style: 'normal' });
            S.step(T('Öne ekleme de O(1)\'dir: deque her iki ucu da aynı hızda destekler.',
                     'Adding at the front is also O(1): a deque supports both ends at the same speed.'), { c: 14, java: 7 });
          } else {
            S.set(idf, { style: 'normal' });
            S.step(T('`push_front(' + t.v + ')` — öne eklendi.', '`push_front(' + t.v + ')` — added at the front.'), { c: [10, 11, 12, 13, 14], java: [6, 7] });
          }
          return;
        }

        if (t.op === 'pop_back') {
          popBackN++;
          if (!ids.length) {
            underBack++;
            decide('empty (back)!', 'del');
            S.step(T('`pop_back()` — deque boş, arka uçta çıkaracak eleman yok. Çökme olmaz, sadece "yok" bildirilir.',
                     '`pop_back()` — the deque is empty, there is nothing at the back end. It does not crash; it simply reports that.'), { c: 17, java: 9 });
            return;
          }
          var bid = ids[ids.length - 1], bv = vals[vals.length - 1];
          if (popBackN === 1) {
            S.set(bid, { style: 'hl' });
            S.step(T('`pop_back()` — arkadaki eleman (' + bv + ') okunur — bu, deque\'nin yığın gibi davrandığı yön.',
                     '`pop_back()` — the element at the back (' + bv + ') is read — this is the direction where a deque behaves like a stack.'), { c: [18, 19], java: [8, 9] });
            ids.pop(); vals.pop(); poppedBack.push(bv);
            S.remove(bid);
            reflow(); count();
            addPopped('back', bv);
            S.step(T('Eleman kaldırıldı, `rear` bir eleman içeri kayar. O(1): dizinin başka hiçbir hücresi taşınmaz.',
                     'The element is removed, `rear` moves in by one. O(1): no other cell has to move.'), { c: 20, java: 9 });
          } else {
            ids.pop(); vals.pop(); poppedBack.push(bv);
            S.remove(bid);
            reflow(); count();
            addPopped('back', bv);
            S.step(T('`pop_back()` → ' + bv + '.', '`pop_back()` → ' + bv + '.'), { c: [18, 19, 20], java: [8, 9] });
          }
          return;
        }

        // pop_front
        popFrontN++;
        if (!ids.length) {
          underFront++;
          decide('empty (front)!', 'del');
          S.step(T('`pop_front()` — deque boş, ön uçta çıkaracak eleman yok. Çökme olmaz, sadece "yok" bildirilir.',
                   '`pop_front()` — the deque is empty, there is nothing at the front end. It does not crash; it simply reports that.'), { c: 24, java: 11 });
          return;
        }
        var fid = ids[0], fv = vals[0];
        if (popFrontN === 1) {
          S.set(fid, { style: 'hl' });
          S.step(T('`pop_front()` — öndeki eleman (' + fv + ') okunur — bu, deque\'nin kuyruk gibi davrandığı yön.',
                   '`pop_front()` — the element at the front (' + fv + ') is read — this is the direction where a deque behaves like a queue.'), { c: [25, 26], java: [10, 11] });
          ids.shift(); vals.shift(); poppedFront.push(fv);
          S.remove(fid);
          reflow(); count();
          addPopped('front', fv);
          S.step(T('Eleman kaldırıldı, `front` bir eleman içeri kayar. Gerçek uygulamada bu da O(1): dairesel dizi ya da çift bağlı liste ile yapılır.',
                   'The element is removed, `front` moves in by one. A real implementation keeps this O(1) too: with a circular array or a doubly linked list.'), { c: 27, java: 11 });
        } else {
          ids.shift(); vals.shift(); poppedFront.push(fv);
          S.remove(fid);
          reflow(); count();
          addPopped('front', fv);
          S.step(T('`pop_front()` → ' + fv + '.', '`pop_front()` → ' + fv + '.'), { c: [25, 26, 27], java: [10, 11] });
        }
      });
      clean(); decide('', 'normal'); S.at(null);
      S.result = { deque: vals.slice(), poppedFront: poppedFront, poppedBack: poppedBack, underflowFront: underFront, underflowBack: underBack };
      S.step(T('Bitti: ' + pushBackN + ' push_back, ' + pushFrontN + ' push_front, ' + popBackN + ' pop_back, ' + popFrontN + ' pop_front çağrısı' +
               (underFront || underBack ? ' (' + underFront + ' önden, ' + underBack + ' arkadan alttan taşma)' : '') +
               '. Deque (front → back): ' + (vals.length ? vals.join(', ') : 'hiçbir şey') + '. Dört işlem de O(1): deque bir yığın ve bir kuyruğun yapabildiği her şeyi yapar.',
               'Done: ' + pushBackN + ' push_back, ' + pushFrontN + ' push_front, ' + popBackN + ' pop_back, ' + popFrontN + ' pop_front call' + ((pushBackN + pushFrontN + popBackN + popFrontN) === 1 ? '' : 's') +
               (underFront || underBack ? ' (' + underFront + ' front, ' + underBack + ' back underflow' + ((underFront + underBack) > 1 ? 's' : '') + ')' : '') +

    }

<script>/* dsanim v2 player — builds the frames in the browser from the chosen example, random data or the user's own values,
 * then plays them: elements are matched by data-id, positions glide, colours fade, new elements appear, removed ones fade.
 * Controls: example picker (normal / hard / edge cases), difficulty + random, own values, first/prev/play/next/last,

 * Keyboard: space = play/pause, ← → = step, Home/End = first/last.
 * URL: lang=tr|en, example=<preset id>, level=easy|normal|hard|extreme, seed=<n>, step=<n>, auto=1, code=c|java|0,
 *      static=1 (print: last step, no controls), mode=slide (compact layout for a 16:9 slide).

          speed: 'Hız', voice: 'Sesli anlatım', step: 'Adım', example: 'Örnek', level: 'Zorluk', random: 'Rastgele',
          own: 'Kendi değerlerin', apply: 'Uygula', custom: 'Kendi değerleri', randomName: 'Rastgele',
          input: 'Girdi', upNext: 'Sıradaki →', lastStep: 'Son adım.', faster: 'Hızlandır (+)', slower: 'Yavaşlat (−)',
          levels: { easy: 'kolay', normal: 'normal', hard: 'zor', extreme: 'uç' },
          groups: { normal: 'Normal', hard: 'Zor', edge: 'Uç ve anormal durumlar' } },
    en: { play: 'Play', pause: 'Pause', next: 'Next step', prev: 'Previous step', first: 'First step', last: 'Last step',
          speed: 'Speed', voice: 'Narration', step: 'Step', example: 'Example', level: 'Difficulty', random: 'Random',
          own: 'Your values', apply: 'Apply', custom: 'Your values', randomName: 'Random',
          input: 'Input', upNext: 'Next →', lastStep: 'Last step.', faster: 'Faster (+)', slower: 'Slower (−)',
          levels: { easy: 'easy', normal: 'normal', hard: 'hard', extreme: 'extreme' },
          groups: { normal: 'Normal', hard: 'Hard', edge: 'Edge and abnormal cases' } }
  };
  var CODE_NAME = { c: 'C', java: 'Java', cpp: 'C++', py: 'Python', pseudo: 'Pseudocode' };
  var SPEEDS = [0.5, 0.75, 1, 1.5, 2, 3, 4];

  function saveSpeed(v) { try { window.localStorage.setItem('dsanim-speed', String(v)); } catch (e) { /* private mode */ } }

      self.sel.appendChild(g);
    });
    var gx = el('optgroup'); gx.label = '—';
    var opR = el('option', '', '🎲 ' + y.randomName); opR.value = '__random'; gx.appendChild(opR);
    if (s.input) { var opC = el('option', '', '✎ ' + y.custom); opC.value = '__custom'; gx.appendChild(opC); }

      var v = self.sel.value;
      if (v === '__random') self.useRandom(self.levelSel.value, null, true);
      else if (v === '__custom') { self.ownRow.hidden = false; self.ownInput.focus(); }
      else { var p = self.presetById(v); self.useData(p.data, p.id, true); }

    bar.appendChild(el('span', 'dsa-etk', y.example));
    bar.appendChild(this.sel);

    this.levelSel = el('select', 'dsa-sec dsa-zor');
    this.levelSel.title = y.level;

      var op = el('option', '', y.levels[l] || l); op.value = l; if (l === 'normal') op.selected = true; self.levelSel.appendChild(op);
    });
    var dice = el('button', 'dsa-d dsa-zar', '🎲');
    dice.type = 'button'; dice.title = y.random + ' (' + y.level.toLowerCase() + ')';
    dice.addEventListener('click', function () { self.useRandom(self.levelSel.value, null, true); });

    var ctl = el('div', 'dsa-denetim');
    function btn(html, title, fn) { var b = el('button', 'dsa-d', html); b.type = 'button'; b.title = title; b.setAttribute('aria-label', title); b.addEventListener('click', fn); ctl.appendChild(b); return b; }
    btn('&#x23EE;', y.first, function () { self.stop(); self.go(0, true); });
    btn('&#x25C0;', y.prev, function () { self.stop(); self.go(self.i - 1, true); });
    this.playBtn = btn('&#x25B6;', y.play, function () { self.playing ? self.stop() : self.play(); });
    this.playBtn.classList.add('dsa-ana');
    btn('&#x25B6;&#x2759;', y.next, function () { self.stop(); self.go(self.i + 1, true); });
    btn('&#x23ED;', y.last, function () { self.stop(); self.go(self.frames.length - 1, true); });
    this.slider = el('input', 'dsa-cubuk');
    this.slider.type = 'range'; this.slider.min = 1;
    this.slider.setAttribute('aria-label', y.step);
    this.slider.addEventListener('input', function () { self.stop(); self.go(+self.slider.value - 1, false); });
    ctl.appendChild(this.slider);
    var sp = el('select', 'dsa-hiz');
    sp.title = y.speed; sp.setAttribute('aria-label', y.speed);
    SPEEDS.forEach(function (h) { var op = el('option', '', h + '×'); op.value = h; if (h === self.speed) op.selected = true; sp.appendChild(op); });
    this.setSpeed = function (v) { self.speed = v; sp.value = String(v); saveSpeed(v); };
    sp.addEventListener('change', function () { self.setSpeed(+sp.value); });
    btn('&minus;', y.slower, function () { var k = SPEEDS.indexOf(self.speed); if (k > 0) self.setSpeed(SPEEDS[k - 1]); });
    ctl.appendChild(sp);
    btn('+', y.faster, function () { var k = SPEEDS.indexOf(self.speed); if (k < SPEEDS.length - 1) self.setSpeed(SPEEDS[k + 1]); });
    if ('speechSynthesis' in window) {
      this.voiceBtn = btn('&#x1F507;', y.voice, function () {
        self.voice = !self.voice; self.voiceBtn.innerHTML = self.voice ? '&#x1F50A;' : '&#x1F507;';
        self.voiceBtn.classList.toggle('etkin', self.voice);
        if (self.voice) self.say(); else window.speechSynthesis.cancel();
      });
    }
    this.root.appendChild(ctl);


    var body = el('div', 'dsa-govde' + (Object.keys(this.code).length ? '' : ' dsa-kodsuz'));
    var stage = el('div', 'dsa-sahne');
    this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    this.svg.setAttribute('role', 'img');
    stage.appendChild(this.svg);
    body.appendChild(stage);
    if (Object.keys(this.code).length) {
      var box = el('div', 'dsa-kod'), tabs = el('div', 'dsa-sekme');
      Object.keys(this.code).forEach(function (k) {
        var b = el('button', k === self.codeLang ? 'etkin' : '', CODE_NAME[k] || k);
        b.type = 'button';
        b.addEventListener('click', function () {
          self.codeLang = k; self.drawCode(); self.markCode();
          Array.prototype.forEach.call(tabs.children, function (c) { c.classList.toggle('etkin', c === b); });
        });
        tabs.appendChild(b);
      });
      box.appendChild(tabs);
      this.pre = el('pre', 'dsa-pre');
      box.appendChild(this.pre);
      body.appendChild(box);
    }
    this.root.appendChild(body);

    this.cap = el('div', 'dsa-cap');
    this.cap.setAttribute('aria-live', 'polite');
    this.root.appendChild(this.cap);
    this.nextEl = el('div', 'dsa-sonraki');
    this.root.appendChild(this.nextEl);


    this.root.tabIndex = 0;
    this.root.addEventListener('keydown', function (e) {
      var t = e.target.tagName;
      if (t === 'SELECT' || t === 'INPUT') return;
      if (e.key === ' ' || e.key === 'k') { e.preventDefault(); self.playing ? self.stop() : self.play(); }
      else if (e.key === 'ArrowRight' || e.key === 'l') { e.preventDefault(); self.stop(); self.go(self.i + 1, true); }
      else if (e.key === 'ArrowLeft' || e.key === 'j') { e.preventDefault(); self.stop(); self.go(self.i - 1, true); }
      else if (e.key === 'Home') { e.preventDefault(); self.stop(); self.go(0, true); }
      else if (e.key === 'End') { e.preventDefault(); self.stop(); self.go(self.frames.length - 1, true); }

      else if (e.key === '-' || e.key === '_') { e.preventDefault(); var k2 = SPEEDS.indexOf(self.speed); if (k2 > 0) self.setSpeed(SPEEDS[k2 - 1]); }
    });

  };

  /** Build all frames for a dataset and show the first one. */
  Player.prototype.useData = function (data, id, reset) {
    var S = new window.DSAnim.Scene();
    this.spec.build(S, data);
    if (!S.frames.length) S.step({ tr: '(boş)', en: '(empty)' }, {});
    this.frames = S.frames;
    this.data = data;
    if (typeof this.spec.code === 'function') { this.code = this.codeOf(data); this.drawCode(); }
    this.vb = window.DSAnim.viewBox(this.frames);
    this.svg.setAttribute('viewBox', this.vb.join(' '));
    this.svg.innerHTML = window.DSAnim.defs() + '<g class="kat kat-arka"></g><g class="kat kat-ok"></g><g class="kat kat-sekil"></g><g class="kat kat-etiket"></g>';
    this.inner = this.frames.map(function (f) { return window.DSAnim.render(f.state, f.order, null); });
    if (this.sel && id && id.indexOf('__') !== 0) this.sel.value = id;
    if (this.spec.input && this.ownInput) this.ownInput.value = this.spec.input.format(data);
    this.drawTape(data);
    this.slider.max = this.frames.length;
    this.i = 0;
    if (reset) { this.stop(); this.go(0, false); }
  };

  Player.prototype.useRandom = function (level, seed, reset) {
    if (!this.spec.random) return;
    var sd = seed || Math.floor(Math.random() * 1e9);
    var data = this.spec.random(level, window.DSAnim.rng(sd));
    this.useData(data, '__random', reset);
    if (this.sel) this.sel.value = '__random';
    if (this.levelSel) this.levelSel.value = level;
  };

  Player.prototype.drawTape = function (data) {
    if (!this.tape || !this.spec.input) return;
    var inp = this.spec.input, toks = inp.tokens ? inp.tokens(data) : String(inp.format(data)).split(/\s+/).filter(Boolean);
    this.tape.innerHTML = '<span class="dsa-etk">' + esc(TEXT[this.lang].input) + '</span>';
    var self = this;
    this.chips = toks.map(function (t) { var c = el('span', 'dsa-jeton', esc(t)); self.tape.appendChild(c); return c; });
  };
  Player.prototype.markTape = function (at) {
    if (!this.chips) return;
    var cur = null;
    this.chips.forEach(function (c, k) {
      var has = at !== undefined && at !== null;
      c.classList.toggle('bitti', has && k < at);
      c.classList.toggle('simdi', has && k === at);
      c.classList.toggle('sonra', has && k === at + 1);
      if (has && k === at) cur = c;
    });
    if (cur && this.tape.scrollWidth > this.tape.clientWidth) this.tape.scrollLeft = Math.max(0, cur.offsetLeft - this.tape.clientWidth / 3);
  };
  Player.prototype.drawCode = function () {
    if (!this.pre) return;
    var lines = this.code[this.codeLang] || [];
    this.pre.innerHTML = lines.map(function (s, i) {
      return '<span class="dsa-sat" data-n="' + (i + 1) + '"><span class="dsa-no">' + (i + 1) + '</span>' + (esc(s) || ' ') + '</span>';
    }).join('');
  };

  Player.prototype.markCode = function () {
    if (!this.pre) return;
    var f = this.frames[this.i], hot = (f.lines && f.lines[this.codeLang]) || [], first = null;
    Array.prototype.forEach.call(this.pre.children, function (s) {
      var on = hot.indexOf(+s.getAttribute('data-n')) >= 0;
      s.classList.toggle('vurgu', on);
      if (on && !first) first = s;
    });
    if (first) {
      var p = this.pre, top = first.offsetTop - p.offsetTop;
      if (top < p.scrollTop || top > p.scrollTop + p.clientHeight - 30) p.scrollTop = Math.max(0, top - 40);
    }
  };

  Player.prototype.go = function (target, animate) {
    var n = this.frames.length;
    if (target < 0 || target >= n) { if (target >= n) this.stop(); return; }
    var jump = Math.abs(target - this.i) !== 1;
    this.i = target;
    this.morph(this.inner[target], animate && !jump && !this.o.static);
    var f = this.frames[target];
    this.cap.innerHTML = fmt(pick(f.cap, this.lang) || '');
    this.counter.textContent = TEXT[this.lang].step + ' ' + (target + 1) + ' / ' + n;
    this.markTape(f.at);
    var nf = this.frames[target + 1], y2 = TEXT[this.lang];
    if (nf) {
      var nc = plain(pick(nf.cap, this.lang)), cut = nc.search(/[.!?](\s|$)/);
      if (cut > 20 && cut < 150) nc = nc.slice(0, cut + 1); else if (nc.length > 150) nc = nc.slice(0, 147) + '…';
      this.nextEl.innerHTML = '<span class="dsa-sonraki-etk">' + esc(y2.upNext) + '</span> ' + esc(nc);
    } else this.nextEl.innerHTML = '<span class="dsa-sonraki-etk">' + esc(y2.lastStep) + '</span>';
    this.slider.value = target + 1;
    this.markCode();
    if (this.voice) this.say();
  };

  Player.prototype.morph = function (html, animate) {
    var self = this, tmp = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    tmp.innerHTML = html;
    if (this.anim) { cancelAnimationFrame(this.anim); this.anim = null; if (this.finish) this.finish(); }
    var jobs = [];
    ['arka', 'ok', 'sekil', 'etiket'].forEach(function (layer) {
      var live = self.svg.querySelector('.kat-' + layer), next = tmp.querySelector('.kat-' + layer);
      if (!live || !next) return;
      var old = {};
      Array.prototype.forEach.call(live.children, function (c) { if (!c.classList.contains('dsa-cikis')) old[c.getAttribute('data-id')] = c; });
      var order = [];
      Array.prototype.slice.call(next.children).forEach(function (y) {
        var id = y.getAttribute('data-id'), o = old[id];
        if (o && o.tagName === y.tagName) {
          delete old[id];
          var attr = y.tagName === 'path' ? 'd' : 'transform', from = o.getAttribute(attr), to = y.getAttribute(attr);
          var a = nums(from), b = nums(to);
          if (y.tagName === 'g') self.updateInner(o, y);
          o.setAttribute('class', y.getAttribute('class'));
          ['stroke', 'marker-end', 'opacity'].forEach(function (k) { if (y.hasAttribute(k)) o.setAttribute(k, y.getAttribute(k)); else if (k !== 'stroke') o.removeAttribute(k); });
          if (animate && a.length && a.length === b.length && from !== to) jobs.push({ e: o, n: attr, a: a, b: b, s: to });
          else o.setAttribute(attr, to);
          order.push(o);
        } else {
          var ne = y.cloneNode(true);
          if (animate) ne.classList.add('dsa-giris');
          order.push(ne);
        }
      });
      Object.keys(old).forEach(function (id) {
        var c = old[id];
        if (animate) { c.classList.add('dsa-cikis'); setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 450); }
        else live.removeChild(c);
      });
      order.forEach(function (e) { live.appendChild(e); });
      if (animate) requestAnimationFrame(function () { requestAnimationFrame(function () {
        Array.prototype.forEach.call(live.querySelectorAll('.dsa-giris'), function (e) { e.classList.remove('dsa-giris'); });
      }); });
    });
    if (!jobs.length) return;
    var dur = 480 / this.speed, t0 = null;
    this.finish = function () { jobs.forEach(function (j) { j.e.setAttribute(j.n, j.s); }); self.finish = null; };
    function tick(t) {
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / dur), e = ease(p);
      jobs.forEach(function (j) { j.e.setAttribute(j.n, fill(j.s, j.a.map(function (x, k) { return +x + (+j.b[k] - +x) * e; }))); });
      if (p < 1) self.anim = requestAnimationFrame(tick); else { self.anim = null; if (self.finish) self.finish(); }
    }
    this.anim = requestAnimationFrame(tick);
  };

  Player.prototype.updateInner = function (o, y) {
    var a = o.children, b = y.children, same = a.length === b.length;
    for (var k = 0; same && k < a.length; k++) if (a[k].tagName !== b[k].tagName) same = false;
    if (!same) { o.innerHTML = y.innerHTML; return; }
    for (var j = 0; j < a.length; j++) {
      var ea = a[j], eb = b[j];
      Array.prototype.forEach.call(eb.attributes, function (at) { if (ea.getAttribute(at.name) !== at.value) ea.setAttribute(at.name, at.value); });
      Array.prototype.slice.call(ea.attributes).forEach(function (at) { if (!eb.hasAttribute(at.name)) ea.removeAttribute(at.name); });
      if (ea.innerHTML !== eb.innerHTML) ea.innerHTML = eb.innerHTML;
    }
  };

  Player.prototype.wait = function () { var c = pick(this.frames[this.i].cap, this.lang) || ''; return (700 + c.length * 20) / this.speed; };
  Player.prototype.play = function () {
    var self = this;
    if (this.i >= this.frames.length - 1) this.go(0, false);
    this.playing = true; this.playBtn.innerHTML = '&#x23F8;'; this.playBtn.title = TEXT[this.lang].pause;
    function next() {
      if (!self.playing) return;
      if (self.i >= self.frames.length - 1) { self.stop(); return; }
      self.go(self.i + 1, true);
      self.schedule(next);
    }
    this.schedule(next);
  };
  Player.prototype.schedule = function (fn) {
    var self = this;
    clearTimeout(this.timer);
    if (this.voice && this.utter) {
      var done = false, backup = setTimeout(function () { if (!done) { done = true; fn(); } }, 20000);
      this.utter.onend = function () { if (!done) { done = true; clearTimeout(backup); self.timer = setTimeout(fn, 500 / self.speed); } };
    } else this.timer = setTimeout(fn, this.wait());
  };
  Player.prototype.stop = function () {
    this.playing = false; clearTimeout(this.timer);
    if (this.playBtn) { this.playBtn.innerHTML = '&#x25B6;'; this.playBtn.title = TEXT[this.lang].play; }
  };
  Player.prototype.say = function () {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance((pick(this.frames[this.i].cap, this.lang) || '').replace(/[`*]/g, ''));
    u.lang = this.lang === 'tr' ? 'tr-TR' : 'en-US';
    u.rate = Math.min(1.6, 0.95 * this.speed);
    var v = window.speechSynthesis.getVoices().filter(function (s) { return s.lang && s.lang.toLowerCase().indexOf(u.lang.slice(0, 2).toLowerCase()) === 0; });
    if (v.length) u.voice = v[0];
    this.utter = u;
    window.speechSynthesis.speak(u);
  };

  function theme() {
    try {
      var p = window.parent && window.parent !== window ? window.parent.document.body : null, s = p && p.getAttribute('data-md-color-scheme');
      if (s === 'slate') document.documentElement.classList.add('dsa-koyu');
      else if (s === 'default') document.documentElement.classList.add('dsa-acik');
    } catch (e) { /* other origin: follow the OS theme */ }
  }
  function reportHeight(id) {
    if (window.parent === window) return;
    var last = 0;
    function send() {
      var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (Math.abs(h - last) > 2) { last = h; window.parent.postMessage({ dsanim: true, ad: id, yukseklik: h }, '*'); }
    }
    if ('ResizeObserver' in window) new ResizeObserver(send).observe(document.documentElement);
    window.addEventListener('load', send);
    setTimeout(send, 300);
  }

  function start() {
    var q = new URLSearchParams(location.search);
    function p(a, b) { return q.get(a) !== null ? q.get(a) : q.get(b); }
    var ids = Object.keys(window.DSAnim.registry);
    Array.prototype.forEach.call(document.querySelectorAll('[data-dsanim]'), function (root, k) {
      var spec = window.DSAnim.registry[root.getAttribute('data-dsanim')] || window.DSAnim.registry[ids[k]];
      if (!spec) return;
      theme();
      var codeArg = p('code', 'kod'), mode = p('mode', 'yer');
      var player = new Player(root, spec, {
        lang: q.get('lang') || (document.documentElement.lang || 'tr').slice(0, 2),
        example: q.get('example'), level: q.get('level'), seed: q.get('seed'),
        step: +(p('step', 'kare') || 1), auto: p('auto', 'oto') === '1', static: p('static', 'statik') === '1',
        code: codeArg, noCode: codeArg === '0', slide: mode === 'slide' || mode === 'slayt'
      });
      if (window.parent === window || q.get('focus') === '1') root.focus({ preventScroll: true });
      reportHeight(spec.id);
      if (q.get('selftest') === '1') selftest(player, spec);
    });
  }
  /** ?selftest=1 — drive the real UI: every example, random data at every level, own values (good and bad). */
  function selftest(player, spec) {
    var errors = [], runs = 0;
    window.addEventListener('error', function (e) { errors.push('window error: ' + e.message); });
    function walk(label) {
      if (!player.frames.length) errors.push(label + ': no frames');
      for (var i = 0; i < player.frames.length; i++) player.go(i, false);
      if (!player.svg.querySelectorAll('[data-id]').length) errors.push(label + ': nothing drawn');
      if (!player.cap.textContent.trim()) errors.push(label + ': empty caption');
      runs++;
    }
    try {
      spec.presets.forEach(function (p) {
        player.sel.value = p.id; player.sel.dispatchEvent(new Event('change')); walk('example ' + p.id);
      });
      (spec.levels || ['easy', 'normal', 'hard', 'extreme']).forEach(function (l) {
        for (var s = 1; s <= 5; s++) { player.useRandom(l, s, true); walk('random ' + l + '/' + s); }
      });
      if (spec.input) {
        player.ownInput.value = spec.input.format(spec.presets[spec.presets.length - 1].data);
        player.applyBtn.click();
        if (player.err.textContent) errors.push('own values rejected: ' + player.err.textContent);
        walk('own values');
        player.ownInput.value = (spec.input.bad && spec.input.bad[1]) || '@@@';
        player.applyBtn.click();
        if (!player.err.textContent) errors.push('bad own values were accepted');
      }
      player.go(0, false); player.go(1, true); player.go(2, true);   // animated transitions must not throw
    } catch (e) { errors.push(String(e && e.stack || e)); }
    var out = document.createElement('pre');
    out.id = 'dsa-selftest';
    out.textContent = JSON.stringify({ id: spec.id, ok: !errors.length, runs: runs, errors: errors });
    document.body.appendChild(out);
  }

  window.DSAnimPlayer = Player;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
